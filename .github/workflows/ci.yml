name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      # Tests run entirely off fixtures. CI never touches the NHL API.
      - name: Tests
        run: uv run pytest -q

      # Publishing must be a no-op when nothing has changed, or the nightly job
      # commits every night and burns a Cloudflare Pages build each time.
      - name: Publishing is idempotent
        working-directory: .
        run: |
          set -euo pipefail
          cd backend && uv run puckline publish && cd ..
          if ! git diff --quiet -- web/public/data; then
            echo "Republishing unchanged data produced a diff:" >&2
            git --no-pager diff --stat -- web/public/data >&2
            exit 1
          fi
          echo "Republishing changed nothing, as it should."

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
